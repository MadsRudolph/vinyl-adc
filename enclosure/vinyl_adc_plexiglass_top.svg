<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="140.0mm"
     height="140.0mm"
     viewBox="0 0 396.8504 396.8504"
     version="1.1">
  <title>Vinyl ADC — Clear Acrylic Top Lid (Calibrated for Adobe Illustrator &amp; Spirit Laser)</title>
  <desc>1:1 Scale: 140.0mm x 140.0mm. viewBox in points (72 DPI) so Adobe Illustrator opens at exact 140mm size.</desc>
  
  <style>
    /* GCC Spirit Laser Cutter Driver Settings */
    .spirit-cut {
      fill: none;
      stroke: #ff0000;
      stroke-width: 0.02835pt; /* 0.01 mm */
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .spirit-raster {
      fill: #000000;
      stroke: none;
      font-family: 'Arial', sans-serif;
      font-size: 9.92pt;
      font-weight: bold;
    }
  </style>

  <!-- 1. CUT HOLES FIRST (M3 Screw clearance, dia 3.4mm, 6.0mm from edges) -->
  <g id="CUT_HOLES" class="spirit-cut">
    <circle cx="17.0079" cy="17.0079" r="4.8189" />
    <circle cx="379.8425" cy="17.0079" r="4.8189" />
    <circle cx="379.8425" cy="379.8425" r="4.8189" />
    <circle cx="17.0079" cy="379.8425" r="4.8189" />
  </g>

  <!-- 2. OPTIONAL LASER ENGRAVING / SILKSCREEN -->
  <g id="ENGRAVE_TEXT" style="display: block;">
    <text x="198.43" y="68.03" text-anchor="middle" class="spirit-raster">VINYL ADC</text>
    <text x="198.43" y="82.20" text-anchor="middle" fill="#000000" font-family="Arial" font-size="6.24pt">3rd-ORDER DELTA-SIGMA • 24-BIT / 48 kHz</text>
    <text x="357.17" y="155.91" text-anchor="end" fill="#000000" font-family="Arial" font-size="5.10pt">CH-R IN</text>
    <text x="357.17" y="240.94" text-anchor="end" fill="#000000" font-family="Arial" font-size="5.10pt">CH-L IN</text>
  </g>

  <!-- 3. CUT OUTER PERIMETER LAST (140x140mm with R=6.0mm corner fillets) -->
  <g id="CUT_OUTER" class="spirit-cut">
    <path d="M 17.0079 0.0
             L 379.8425 0.0
             A 17.0079 17.0079 0 0 1 396.8504 17.0079
             L 396.8504 379.8425
             A 17.0079 17.0079 0 0 1 379.8425 396.8504
             L 17.0079 396.8504
             A 17.0079 17.0079 0 0 1 0.0 379.8425
             L 0.0 17.0079
             A 17.0079 17.0079 0 0 1 17.0079 0.0
             Z" />
  </g>
</svg>
