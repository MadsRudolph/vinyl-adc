<text class="note" x="18" y="396">The loop pushes quantisation noise out of the audio band; the decimator then removes what is left above it.</text>
<text class="note" x="18" y="416" fill="#8f8888">The two traces lie on top of each other — right is dashed so both are visible. The spike near 13 kHz is the modulator’s idle tone.</text>
