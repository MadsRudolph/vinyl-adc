# Mads uses only the Scarlett. The other cards are switched off so a DAW (Ardour links every
# physical input it finds) cannot pull their clocks into the graph: the webcam mic runs at 32 kHz
# and gave robotic, stuttering audio in Ardour (2026-11-21). Delete a block to bring a card back.
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "alsa_card.usb-NOVATEK_USB_Camera-02" }
      { device.name = "~alsa_card.usb-DisplayLink_LAPDOCK.*" }
      { device.name = "alsa_card.pci-0000_00_1f.3" }
      { device.name = "alsa_card.pci-0000_01_00.1" }
    ]
    actions = { update-props = { device.disabled = true } }
  }
]
