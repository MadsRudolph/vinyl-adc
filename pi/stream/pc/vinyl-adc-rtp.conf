# Vinyl ADC live input: receives vinyl-stream's RTP (L24, 48 kHz, stereo, 1 ms packets) from the Pi
# and shows it as a capture device "Vinyl ADC" that any DAW can record (through PipeWire's JACK/ALSA/Pulse).
# Install: copy to ~/.config/pipewire/pipewire.conf.d/ and `systemctl --user restart pipewire`.
# The PC's firewall must let UDP 46000 in from the Pi.
context.modules = [
  { name = libpipewire-module-rtp-source
    args = {
      source.ip         = 0.0.0.0
      source.port       = 46000
      sess.latency.msec = 40          # jitter buffer: must exceed the PC graph quantum (1024 frames = 21 ms in a DAW, ~32 ms delay); 5 ms gave silence there
      sess.ignore-ssrc  = true        # the Pi picks a new SSRC each time the streamer restarts
      sess.media        = "audio"
      rtp.ptime         = 1           # the Pi sends 1 ms (48-frame) packets
      audio.format      = "S24BE"
      audio.rate        = 48000
      audio.channels    = 2
      audio.position    = [ FL FR ]
      stream.props = {
        media.class      = "Audio/Source"
        node.name        = "vinyl-adc"
        node.description = "Vinyl ADC"
        # no node.always-process: with it, the input pulled the Dummy-Driver into a DAW's graph and stalled the Scarlett (2026-11-21)
      }
    }
  }
]
