# Cap the graph at 256 frames (5.3 ms). At 1024 (Ardour's default request) the Vinyl ADC RTP input
# arrives in lumps that overflow its 40 ms receive buffer ("receiver read overrun") and the audio
# turns robotic; at 256 it runs clean (tested 2026-11-21).
context.properties = {
  default.clock.quantum     = 256
  default.clock.max-quantum = 256
}
