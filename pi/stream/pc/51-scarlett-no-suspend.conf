# Scarlett: always the clock, never suspended.
# The Vinyl ADC RTP input runs on PipeWire's Dummy-Driver (priority.driver 200000). When a DAW linked it
# into the same graph as the Scarlett (1100 by default), the Dummy-Driver won, sat idle, and the Scarlett
# stalled (PREPARED or XRUN, hw_ptr frozen) - every audio app froze with it (2026-11-21).
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.usb-Focusrite_Scarlett.*" }
      { node.name = "~alsa_input.usb-Focusrite_Scarlett.*" }
      { node.name = "alsa_input.hw_USB_0" }
    ]
    actions = { update-props = { session.suspend-timeout-seconds = 0, priority.driver = 300000 } }
  }
]
